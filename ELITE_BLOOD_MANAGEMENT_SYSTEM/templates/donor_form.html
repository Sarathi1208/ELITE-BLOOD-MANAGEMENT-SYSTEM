{% extends 'base.html' %}{% block title %}Donor Profile | ELITE Blood{% endblock %}{% block content %}<div class="form-page"><div class="page-heading"><div><span class="eyebrow">DONOR REGISTRATION</span><h1>{{ 'Update your profile' if donor else 'Complete donor profile' }}</h1><p>Share accurate details so people nearby can find a potential donor.</p></div></div><form method="post" enctype="multipart/form-data" class="panel form-panel"><div class="form-grid"><label>Full name<input value="{{ current_user.full_name }}" disabled></label><label>Age (18–65)<input type="number" name="age" min="18" max="65" required value="{{ donor.age if donor else '' }}" placeholder="Your age"></label><label>Gender<select name="gender" required><option value="">Select gender</option>{% for g in ['Male','Female','Other'] %}<option {{ 'selected' if donor and donor.gender==g else '' }}>{{ g }}</option>{% endfor %}</select></label><label>Blood group<select name="blood_group" required><option value="">Select blood group</option>{% for g in blood_groups %}<option {{ 'selected' if donor and donor.blood_group==g else '' }}>{{ g }}</option>{% endfor %}</select></label><label>Contact number<input name="phone" required maxlength="20" value="{{ donor.phone if donor else '' }}" placeholder="Mobile number"></label><label>Email address<input value="{{ current_user.email }}" disabled></label><label>City<input name="city" required maxlength="100" value="{{ donor.city if donor else '' }}" placeholder="Your city"></label><label>Address<input name="address" required maxlength="250" value="{{ donor.address if donor else '' }}" placeholder="Street, area"></label><label class="full-field">Medical certificate <span class="muted inline-note">PDF, JPG or PNG · Max 5 MB</span><input type="file" name="certificate" accept=".pdf,.png,.jpg,.jpeg"></label></div><label class="check-label"><input type="checkbox" name="available" {{ 'checked' if not donor or donor.available else '' }}> I am currently available to be contacted as a donor.</label><div class="form-actions"><button class="btn btn-primary">Save donor profile →</button><a class="btn btn-outline" href="{{ url_for('dashboard') }}">Cancel</a></div></form></div>{% endblock %}
